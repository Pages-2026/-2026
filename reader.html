<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#dec7b5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="صفحات">
<script>try{var t=localStorage.getItem('safhat_theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>قراءة — صفحات</title>
<link rel="stylesheet" href="style.css">
<script>try{if(localStorage.getItem('safhat_lite')==='1')document.documentElement.classList.add('lite')}catch(e){}</script>
<style>
#aud{position:fixed;inset:auto 0 0 0;background:var(--surface);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;flex-direction:column;gap:8px;user-select:none}
#aud .r{display:flex;align-items:center;gap:10px;justify-content:center}
#aud button{min-height:0;padding:8px 14px}
#aud input[type=range]{flex:1;direction:ltr}
#aud small{color:var(--muted);direction:ltr;white-space:nowrap}
body.hasaud{padding-bottom:120px}
@media print { body { display: none !important; } }
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
header.bar{padding:10px 4%}
header a{color:var(--deep)}
#title{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45vw}
#pg{color:var(--muted);font-size:.9rem;white-space:nowrap}
#pages{max-width:860px;margin:18px auto;padding:0 10px;display:flex;flex-direction:column;gap:14px;align-items:center}
.page{width:100%;background:#fff;border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,.12);overflow:hidden;position:relative;aspect-ratio:3/4}
.page canvas{display:block;width:100%;height:100%;pointer-events:none;-webkit-user-drag:none;user-drag:none}
#state{text-align:center;padding:70px 20px}
#state .btn{margin-top:14px}
.spin{width:34px;height:34px;border:4px solid var(--line);border-top-color:var(--deep);border-radius:50%;margin:0 auto 14px;animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
<header class="bar">
  <a href="library.html" id="back">← رجوع</a>
  <span id="title"></span>
  <a href="#" id="rvLink" style="white-space:nowrap">⭐ التقييمات</a>
  <span id="pg"></span>
</header>
<div id="aud" hidden></div>
<div id="state"><div class="spin"></div><p>جاري فتح القصة…</p></div>
<main id="pages" aria-label="صفحات القصة"></main>

<script type="module">
import { auth, db, ready, displayId } from './app.js';
import { signOut } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import { doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
import { getSession, loadPdfBytes, clearSession, friendly } from './app.js';
import { enableProtection, loadAudioBytes } from './app.js';

enableProtection();

const $ = (id) => document.getElementById(id);
const q = new URLSearchParams(location.search);
const storyId = q.get('story') || q.get('id') || '';
const sample = q.get('mode') === 'sample';
const lite = document.documentElement.classList.contains('lite');

const showState = (html) => { $('state').style.display = ''; $('state').innerHTML = html; };
const errBox = (msg, extra = '') =>
  showState(`<p class="msg" style="min-height:0">${String(msg).replace(/[<>&]/g, '')}</p>${extra}`);

if (sample) $('back').href = 'index.html#books';

async function main() {
  if (!/^[A-Za-z0-9_-]{1,64}$/.test(storyId)) return errBox('رابط غير صالح', '<a class="btn" href="index.html">الرئيسية</a>');

  const user = await ready;
  if (!user) { location.replace('login.html?next=' + encodeURIComponent('reader.html' + location.search)); return; }

  let story;
  try {
    const sd = await getDoc(doc(db, 'stories', storyId));
    if (!sd.exists()) return errBox('القصة غير موجودة', '<a class="btn" href="index.html">الرئيسية</a>');
    story = sd.data();
    $('rvLink').href = 'reviews.html?story=' + encodeURIComponent(storyId);
  if (!sample && story.hasAudio && story.audioChunks) initAudio(story);
  $('title').textContent = story.title + (sample ? ' — عينة' : '');
  } catch (e) { return errBox(friendly(e)); }

  let buf;
  try {
    if (!sample) await getSession();           // تسجيل/فحص الجهاز (حد 2)
    buf = await loadPdfBytes(storyId, story, sample, (d, n) => {
      const p = document.querySelector('#state p'); if (p) p.textContent = `جاري التحميل ${Math.round((d / n) * 100)}%`;
    });
  } catch (e) {
    if (e.code === 'DEVICE_LIMIT') {
      await signOut(auth).catch(() => {});
      return errBox('تم الوصول للحد الأقصى للأجهزة المسموح بها لهذا الحساب - 5 أجهزة كحد أقصى', '<a class="btn" href="index.html">الرئيسية</a>');
    }
    if (e.code === 'NOT_PURCHASED') return errBox('لم تشترِ هذه القصة بعد.', '<a class="btn" href="index.html#books">تصفّح الكتب</a>');
    return errBox(friendly(e), '<a class="btn" href="library.html">مكتبتي</a>');
  }

  const pdfjs = window.pdfjsLib;
  pdfjs.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  let pdf;
  try {
    pdf = await pdfjs.getDocument({ data: buf, isEvalSupported: false, enableXfa: false }).promise;
  } catch (e) { console.error('PDF error', e); return errBox('تعذّر قراءة الملف', '<p style="direction:ltr;font-size:.8rem;opacity:.7">' + String((e && (e.name + ': ' + e.message)) || e).replace(/[<>&]/g, '') + '</p>'); }
  buf = null;

  $('state').style.display = 'none';
  const first = await pdf.getPage(1);
  const v0 = first.getViewport({ scale: 1 });
  const wrap = $('pages');
  const stamp = (displayId(user.email) || 'user') + ' · ' + new Date().toISOString().slice(0, 10);
  const holders = [];
  const rendering = new Set();

  for (let i = 1; i <= pdf.numPages; i++) {
    const h = document.createElement('div');
    h.className = 'page';
    h.dataset.n = i;
    h.style.aspectRatio = v0.width + ' / ' + v0.height;
    wrap.appendChild(h);
    holders.push(h);
  }

  function watermark(ctx, w, h) {
    ctx.save();
    ctx.globalAlpha = 0.07;
    ctx.fillStyle = '#000';
    ctx.font = `${Math.round(w / 26)}px Tahoma, Arial`;
    ctx.textAlign = 'center';
    ctx.translate(w / 2, h / 2);
    ctx.rotate(-Math.PI / 6);
    const step = Math.round(w / 5);
    for (let y = -h; y < h; y += step) for (let x = -w; x < w; x += w / 1.2) ctx.fillText(stamp, x, y);
    ctx.restore();
  }

  async function render(h) {
    const n = +h.dataset.n;
    if (rendering.has(n) || h.dataset.r === '1') return;
    rendering.add(n);
    try {
      const page = await pdf.getPage(n);
      const base = page.getViewport({ scale: 1 });
      const cssW = h.clientWidth || 800;
      const dpr = Math.min(window.devicePixelRatio || 1, lite ? 1 : 2);
      const vp = page.getViewport({ scale: (cssW / base.width) * dpr });
      const canvas = document.createElement('canvas');
      canvas.width = Math.floor(vp.width);
      canvas.height = Math.floor(vp.height);
      canvas.draggable = false;
      const ctx = canvas.getContext('2d', { alpha: false });
      await page.render({ canvasContext: ctx, viewport: vp }).promise;
      watermark(ctx, canvas.width, canvas.height);
      page.cleanup();
      h.style.aspectRatio = base.width + ' / ' + base.height;
      h.replaceChildren(canvas);
      h.dataset.r = '1';
    } catch (e) { /* تجاهل أخطاء صفحة واحدة */ }
    rendering.delete(n);
  }

  function release(h) {
    if (h.dataset.r !== '1') return;
    const c = h.firstChild;
    if (c) { c.width = 0; c.height = 0; }
    h.replaceChildren();
    h.dataset.r = '0';
  }

  const io = new IntersectionObserver((es) => es.forEach((x) => {
    if (x.isIntersecting) render(x.target); else release(x.target);
  }), { rootMargin: lite ? '300px 0px' : '900px 0px' });
  holders.forEach((h) => io.observe(h));

  // مؤشر الصفحة
  let tick = false;
  const upd = () => {
    tick = false;
    const mid = innerHeight / 2;
    let cur = 1;
    for (const h of holders) { const r = h.getBoundingClientRect(); if (r.top <= mid) cur = +h.dataset.n; else break; }
    $('pg').textContent = `${cur} / ${pdf.numPages}`;
  };
  addEventListener('scroll', () => { if (!tick) { tick = true; requestAnimationFrame(upd); } }, { passive: true });
  upd();

  // إعادة الرسم عند تغيّر العرض
  let lastW = innerWidth, t;
  addEventListener('resize', () => {
    clearTimeout(t);
    t = setTimeout(() => {
      if (innerWidth === lastW) return;
      lastW = innerWidth;
      holders.forEach((h) => { release(h); io.unobserve(h); io.observe(h); });
    }, 250);
  });
}

function initAudio(story) {
  const box = $('aud'); box.hidden = false; document.body.classList.add('hasaud');
  box.innerHTML = '<div class="r"><button class="btn" type="button" id="aLoad">🎧 استمع للقصة</button></div>';
  const fmt = (t) => { t = Math.max(0, Math.floor(t || 0)); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); };
  $('aLoad').onclick = async () => {
    $('aLoad').disabled = true; $('aLoad').textContent = 'جاري تحميل الصوت…';
    let parts;
    try { parts = await loadAudioBytes(storyId, story, (d, n) => { $('aLoad').textContent = 'جاري تحميل الصوت ' + Math.round(d / n * 100) + '%'; }); }
    catch (e) { $('aLoad').disabled = false; $('aLoad').textContent = '🎧 استمع للقصة'; alert(friendly(e)); return; }
    const url = URL.createObjectURL(new Blob(parts, { type: story.audioType || 'audio/mpeg' }));
    parts = null;
    box.innerHTML = `<div class="r"><input type="range" id="aSeek" min="0" max="1000" value="0" aria-label="التقدم"><small id="aT">0:00 / 0:00</small></div>
      <div class="r"><button class="soft" type="button" id="aB">⏪ 15</button><button class="btn" type="button" id="aP">▶ تشغيل</button><button class="soft" type="button" id="aF">15 ⏩</button><button class="soft" type="button" id="aS">1x</button></div>`;
    const au = new Audio(url); au.preload = 'auto'; au.controlsList = 'nodownload';
    const speeds = [1, 1.25, 1.5, 0.75]; let si = 0, drag = false;
    $('aP').onclick = () => { au.paused ? au.play().catch(() => {}) : au.pause(); };
    $('aB').onclick = () => { au.currentTime = Math.max(0, au.currentTime - 15); };
    $('aF').onclick = () => { au.currentTime = Math.min(au.duration || 1e9, au.currentTime + 15); };
    $('aS').onclick = () => { si = (si + 1) % speeds.length; au.playbackRate = speeds[si]; $('aS').textContent = speeds[si] + 'x'; };
    au.onplay = () => { $('aP').textContent = '⏸ إيقاف'; };
    au.onpause = () => { $('aP').textContent = '▶ تشغيل'; };
    au.onended = () => { $('aP').textContent = '▶ تشغيل'; };
    au.ontimeupdate = () => { if (!drag && au.duration) $('aSeek').value = Math.round(au.currentTime / au.duration * 1000); $('aT').textContent = fmt(au.currentTime) + ' / ' + fmt(au.duration); };
    au.onloadedmetadata = () => { $('aT').textContent = '0:00 / ' + fmt(au.duration); };
    $('aSeek').oninput = () => { drag = true; };
    $('aSeek').onchange = () => { if (au.duration) au.currentTime = au.duration * $('aSeek').value / 1000; drag = false; };
    au.play().catch(() => {});
  };
}

main();
</script>
</body>
</html>
